name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (prettier + typecheck)
        run: npm run lint

      - name: Version consistency
        run: npm run check:versions

      - name: Build
        run: npm run build

      - name: Tests + Coverage
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

  changelog:
    name: Changelog Updated
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md updated on version bump
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          if echo "$CHANGED" | grep -q "^manifest.json$"; then
            echo "$CHANGED" | grep -q "^CHANGELOG.md$" || {
              echo "Version bump detected but CHANGELOG.md not updated."
              exit 1
            }
          else
            echo "No version bump, skipping changelog check."
          fi

  test-regression:
    name: Test Count Regression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests on PR branch
        run: npx jest --json --outputFile=pr-results.json || true

      - name: Checkout base branch
        run: git checkout origin/main

      - name: Install base dependencies
        run: npm ci

      - name: Run tests on base branch
        run: npx jest --json --outputFile=base-results.json || true

      - name: Compare test names
        run: |
          node -e "
            const base = require('./base-results.json');
            const pr = require('./pr-results.json');

            const getNames = (r) => r.testResults
              .flatMap(f => f.testResults)
              .map(t => t.fullName);

            const baseNames = new Set(getNames(base));
            const prNames = new Set(getNames(pr));

            const removed = [...baseNames].filter(n => !prNames.has(n));

            if (removed.length > 0) {
              console.error('Tests removed or renamed:');
              removed.forEach(n => console.error('  - ' + n));
              process.exit(1);
            }

            console.log('No tests removed. OK.');
          "
